name: Build Vite App

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest # or 'self-hosted' if you're running it locally

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Build Vite app
              run: npm run build

            - name: Upload built files
              uses: actions/upload-artifact@v4
              with:
                  name: vite-dist
                  path: dist/
