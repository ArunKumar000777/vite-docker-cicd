name: Build and Deploy Vite App Locally

on:
    push:
        branches: [main]

jobs:
    build-deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Build Vite app
              run: npm run build

            - name: Build Docker image
              run: docker build -t vite-apache .

            - name: Stop old container (if any)
              run: |
                  if (docker ps -q -f name=vite-app) {
                    docker stop vite-app
                                    }
                      if (docker ps -a -q -f name=vite-app) {
                      docker rm vite-app
                    }

            - name: Start new Docker container
              run: docker run -d -p 8080:80 --name vite-app vite-apache
